  ctx.textAlign = 'center'; ctx.fillText(str, W/2, y); ctx.globalAlpha = 1;
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d0d20'); g.addColorStop(1, '#080810');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff';
  for (const s of stars) { ctx.globalAlpha = 0.35; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;
  for (const p of pipes) { drawPen(p.x, 0, p.gapY - GAP/2, true); drawPen(p.x, p.gapY + GAP/2, H - GROUND - (p.gapY + GAP/2), false); }
  ctx.fillStyle = '#171728'; ctx.fillRect(0, H - GROUND, W, GROUND);
  ctx.fillStyle = '#ff699e'; ctx.fillRect(0, H - GROUND, W, 3);
  drawBird();
  if (state === 'playing' || state === 'dead') text(score, 92, 52, '#ffffff');
  if (state === 'ready') {
    text('FLAPPY OV', 190, 40, '#ff699e');
    text('Tap, click, or press Space', 236, 17, '#d8d8e6');
    text('Dodge the pens. Impress nobody.', 264, 15, '#8a8a9e');
  }
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(5,5,12,0.62)'; ctx.fillRect(0, 0, W, H - GROUND);
    text('STILL NOT', 218, 40, '#ffffff');
    text('IMPRESSED.', 262, 40, '#ff699e');
    text('Score: ' + score, 330, 24, '#ffffff');
    text('Best: ' + best, 362, 19, '#b9b9c9');
    text('Tap to play again', 420, 16, '#8a8a9e');
  }
}
function loop(t) { const dt = Math.min(0.033, (t - last) / 1000 || 0); last = t; step(dt); draw(); requestAnimationFrame(loop); }
reset(); requestAnimationFrame(loop);
</script>
